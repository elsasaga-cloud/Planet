# 通用「云盘大文件 → GitHub Actions 运行器搬运 → 全文抽取入库」workflow（可移植版，T29-U38 整理）。
# 用法：把本文件放到仓库 .github/workflows/drive-zip-ingest.yml（若代理的 GitHub 令牌没有 workflow 权限，需人工在网页上创建一次），
#      之后代理只要修改并推送 ingest/RUN（KEY=VALUE）就会触发一次运行；也可在 Actions 页手动 Run workflow。
name: Drive zip ingest
on:
  push:
    paths:
      - .github/workflows/drive-zip-ingest.yml
      - ingest/RUN
  workflow_dispatch:
permissions:
  contents: write          # 需要：把抽取结果提交回分支 + 上传 Release 资产
concurrency:
  group: drive-zip-ingest  # 同一时间只跑一个；后来的排队（注意：同组最多 1 个排队位，连续两次推送间隔要 >1 分钟，否则前一个待运行会被顶掉）
  cancel-in-progress: false
jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 350   # GitHub 单任务上限 6 h；大包靠 CHECKPOINT 分批提交，超时也不丢已完成部分
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: System tools (OCR / PDF / 7z / LibreOffice)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq tesseract-ocr tesseract-ocr-chi-sim poppler-utils p7zip-full > /dev/null
          sudo apt-get install -y -qq libreoffice-writer libreoffice-calc libreoffice-impress > /dev/null || echo "libreoffice unavailable (.doc/.xls/.ppt 将只记元数据)"
          sudo mkdir -p /mnt/work && sudo chown -R "$(id -u):$(id -g)" /mnt/work || true   # 运行器根盘只有 ~14 GB，/mnt 有 ~60 GB
          df -h / /mnt | sed -n 1,3p
      - name: Python deps
        run: python -m pip install -q requests gdown python-docx openpyxl xlrd pdfplumber pypdf python-pptx pillow
      - name: Load RUN (KEY=VALUE → env)
        run: grep -E '^[A-Z_][A-Z0-9_]*=' ingest/RUN >> "$GITHUB_ENV"
      - name: Ingest
        env:
          GH_TOKEN: ${{ github.token }}
          GIT_REF: ${{ github.ref_name }}
          WORK_DIR: /mnt/work
        run: |
          git config user.name "ingest[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python ingest/ingest_zip.py
      - name: Final commit (safety)
        if: always()
        run: |
          git add data || true
          git commit -q -m "ingest: 收尾提交 $(date -u +%Y-%m-%dT%H:%MZ)" || { echo "nothing to commit"; exit 0; }
          git pull -q --rebase -X theirs origin "${{ github.ref_name }}" || true
          git push -q origin "HEAD:${{ github.ref_name }}"
