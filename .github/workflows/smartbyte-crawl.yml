# T15：SmartByte 官网整站归档。Arena 沙箱不能访问 smartbyte-switch.com，
# 故由 GitHub Actions 运行器抓取，文本/清单提交回本分支，二进制（规格书 PDF、图片）作为构建产物 + Release 附件保存。
# 注意：代理的 GitHub 连接没有 workflows 权限，无法把本文件推到 .github/workflows/；
# 需要 Simon 在 GitHub 网页上把本文件原样保存为 .github/workflows/smartbyte-crawl.yml（分支 arena/3f35b9b3-planet），保存即自动运行。
name: SmartByte site archive
on:
  push:
    branches: [arena/3f35b9b3-planet]
    paths:
      - .github/workflows/smartbyte-crawl.yml
      - scripts/smartbyte_crawl/crawl.py
  workflow_dispatch:
    inputs:
      max_pages:
        description: 最大页数
        default: "1500"
      delay:
        description: 每请求间隔秒
        default: "0.8"
permissions:
  contents: write
concurrency:
  group: smartbyte-crawl
  cancel-in-progress: false
jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 170
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq poppler-utils zip > /dev/null
          python -m pip install -q requests
      - name: Crawl
        env:
          MAX_PAGES: ${{ github.event.inputs.max_pages || '1500' }}
          DELAY: ${{ github.event.inputs.delay || '0.8' }}
        run: python scripts/smartbyte_crawl/crawl.py data/smartbyte_site_raw crawl_bin
      - name: Zip binaries
        run: |
          cd crawl_bin
          zip -qr ../smartbyte_datasheets_$(date -u +%Y%m%d).zip downloads || true
          zip -qr ../smartbyte_images_$(date -u +%Y%m%d).zip images || true
          cd ..
          ls -la smartbyte_*.zip || true
          cat crawl_bin/pdfs_committed.flag || true
      - uses: actions/upload-artifact@v4
        with:
          name: smartbyte-site-binaries
          path: smartbyte_*.zip
          retention-days: 90
          if-no-files-found: ignore
      - name: Commit archive to branch
        run: |
          git config user.name "smartbyte-archiver[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/smartbyte_site_raw
          git commit -m "T15: SmartByte 官网整站原始归档（Actions 抓取 $(date -u +%Y-%m-%d)）" || { echo "nothing to commit"; exit 0; }
          git pull --rebase origin "${{ github.ref_name }}" || true
          git push origin "HEAD:${{ github.ref_name }}"
      - name: Release binaries
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="smartbyte-site-$(date -u +%Y%m%d)"
          FILES=$(ls smartbyte_*.zip 2>/dev/null || true)
          [ -z "$FILES" ] && { echo "no zips"; exit 0; }
          gh release create "$TAG" $FILES --target "${{ github.sha }}" --latest=false \
            --title "SmartByte 官网归档 $(date -u +%Y-%m-%d)（规格书 PDF + 图片）" \
            --notes "T15 整站归档的二进制部分。文本/清单见分支 ${{ github.ref_name }} 的 data/smartbyte_site_raw/。" \
          || gh release upload "$TAG" $FILES --clobber
